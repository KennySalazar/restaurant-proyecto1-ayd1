<section class="auth-page">
  <div class="auth-page__header">
    <div class="auth-page__badge" aria-hidden="true">
      <i class="pi pi-envelope"></i>
    </div>

    <div>
      <span class="auth-page__kicker">
        {{ 'auth.recovery.kicker' | transloco }}
      </span>

      <h1>
        {{ 'auth.recovery.title' | transloco }}
      </h1>
    </div>
  </div>

  <p class="auth-page__intro">
    {{ 'auth.recovery.description' | transloco }}
  </p>

  <div class="auth-page__divider"></div>

  <app-form-feedback [message]="serverMessage()" />

  <form
    class="auth-form"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
  >
    <div class="form-field">
      <label for="recovery-email">
        {{ 'auth.fields.email' | transloco }}
      </label>

      <div class="form-field__control">
        <i class="pi pi-envelope"></i>

        <input
          id="recovery-email"
          pInputText
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.fields.emailPlaceholder' | transloco"
        />
      </div>

      <app-field-error
        [control]="form.controls.email"
        [submitted]="submitted()"
      />
    </div>

    <button
      class="login-submit"
      type="submit"
      [disabled]="isSubmitting()"
    >
      @if (isSubmitting()) {
        <i class="pi pi-spin pi-spinner"></i>
      }

      <span>
        {{ 'auth.recovery.submit' | transloco }}
      </span>

      @if (!isSubmitting()) {
        <i class="pi pi-arrow-right"></i>
      }
    </button>

    <a
      class="recovery-back"
      routerLink="/auth/login"
    >
      <i class="pi pi-arrow-left"></i>
      {{ 'auth.recovery.back' | transloco }}
    </a>
  </form>

  <div class="auth-page__footer">
    <span class="auth-page__footer-icon">
      <i class="pi pi-shield"></i>
    </span>

    <div>
      <strong>
        {{ 'auth.recovery.footer' | transloco }}
      </strong>
    </div>
  </div>
</section>
