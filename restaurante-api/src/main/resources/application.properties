spring.application.name=restaurante-api
spring.profiles.active=dev
server.servlet.context-path=/api/v1

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true


# Spring Data JPA
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT. The signing secret is intentionally required and validated at startup.
security.jwt.secret-key=${SECRET_KEY_JWT:}
security.jwt.expiration-time=${EXPIRATION_TIME_JWT:86400000}


# The bootstrap password is required when the application starts.
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:adminrest@gmail.com}
app.bootstrap.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

# OTP
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
